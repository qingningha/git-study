    <h1>Hello Dev</h1>
    <h2>用户登录功能开发中</h2>
    <p>git add：把修改放进暂存区</p>
    <p>git commit：把暂存区的内容保存成一个版本</p>
    <!-- 写作业 -->
    <!-- ↓ -->
    <!-- 放进书包       ← git add -->
    <!-- ↓ -->
    <!-- 交给老师       ← git commit -->

    <!-- git restore index.html 
        只能恢复：
        工作区的修改 

        不能恢复：
        暂存区的内容
        已经 commit 的内容
    -->

    <!-- git add
    → 加入暂存区

    git restore --staged
    → 从暂存区拿出来

    git restore
    → 丢掉工作区修改 -->
